<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1220; --panel: #0f172a; --card: #1b2336; --muted: #272f42;
  --border: #334155; --text: #f8fafc; --text-dim: #94a3b8;
  --accent: #22c55e; --imports: #60a5fa; --reads: #fbbf24; --runs: #22c55e; --target: #c084fc; --calls: #f472b6;
  --danger: #ef4444; --warn: #fbbf24;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, Segoe UI, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 280px 1fr 440px; grid-template-rows: 48px 1fr; height: 100%; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { margin: 0; font: 600 15px var(--mono); letter-spacing: .02em; }
header h1 span { color: var(--accent); }
.stats { display: flex; gap: 14px; color: var(--text-dim); font: 400 12px var(--mono); margin-left: auto; flex-wrap: wrap; }
.stats b { color: var(--text); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 12px; min-height: 30px; color: var(--text-dim); }
.seg button[aria-pressed=true] { background: var(--muted); color: var(--text); }
header .btn, .seg button { box-sizing: border-box; height: 32px; min-height: 32px; padding: 0 14px; font-size: 12px; line-height: 1; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
header .btn { width: 124px; flex: none; }
.seg button { min-width: 56px; }
aside, section.detail { background: var(--panel); overflow: auto; padding: 12px; }
aside { border-right: 1px solid var(--border); }
section.detail { border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
#viewport { position: relative; min-height: 0; }
#cy, #g3d { position: absolute; inset: 0; }
#cy { background: radial-gradient(circle at 50% 40%, #111a2e 0%, var(--bg) 70%); }
#g3d { display: none; }
label.lbl { display: block; font: 500 11px var(--mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
input[type=search], input[type=text], select, textarea { width: 100%; padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 5px 0; min-height: 32px; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li button { width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; min-height: 32px; display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
.plist li button:hover { background: var(--muted); }
.plist li button[aria-pressed=true] { background: var(--muted); box-shadow: inset 2px 0 var(--accent); }
.plist .n { color: var(--text-dim); font: 400 12px var(--mono); flex: none; }
.plist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arch { color: var(--text-dim); font-style: italic; }
h2 { font: 600 15px var(--mono); margin: 0 0 4px; word-break: break-word; }
.sub { color: var(--text-dim); font: 400 12px var(--mono); word-break: break-all; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.card h3 { margin: 0 0 6px; font: 500 11px var(--mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
.card ul { list-style: none; padding: 0; margin: 0; }
.card li { padding: 3px 0; word-break: break-word; }
.card li button { background: none; border: 0; padding: 2px 0; text-align: left; color: var(--text); }
.card li button:hover { color: var(--accent); text-decoration: underline; }
.tag { font: 500 10px var(--mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-dim); margin-left: 6px; }
.tag.warn { color: var(--warn); border-color: var(--warn); }
.btn { background: var(--accent); color: #052e16; border: 0; border-radius: 6px; padding: 7px 12px; font-weight: 600; min-height: 34px; }
.btn.ghost { background: var(--muted); color: var(--text); font-weight: 500; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { min-height: 28px; padding: 3px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
.empty { max-width: 560px; margin: 12vh auto; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.empty code, code.k { font-family: var(--mono); background: var(--muted); padding: 2px 6px; border-radius: 4px; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; background: rgba(15,23,42,.85); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: 400 11px var(--mono); color: var(--text-dim); z-index: 2; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; font: 400 12px var(--mono); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 80vw; }
.toast.on { opacity: 1; }
/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -12px -12px 10px; padding: 0 8px; flex: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--text-dim); min-height: 40px; }
.tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); }
.tabbody { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
/* terminal-style output */
.term { background: #070c17; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: 400 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; overflow: auto; }
.chatbox { flex: 1; min-height: 160px; }
.msg { margin: 6px 0; }
.msg.user { color: var(--accent); }
.msg.user::before { content: "> "; }
.msg.asst { color: var(--text); font-family: var(--sans); font-size: 13px; }
.msg.sys { color: var(--text-dim); }
.msg.err { color: var(--danger); }
.tool { margin: 6px 0; border-left: 2px solid var(--calls); padding-left: 8px; color: var(--text-dim); }
.tool b { color: var(--calls); font-weight: 500; }
.tool details { margin-top: 2px; }
.tool pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
.banner { background: rgba(239,68,68,.15); border: 1px solid var(--danger); color: #fecaca; border-radius: 8px; padding: 6px 10px; margin: 6px 0; font-size: 12px; }
.ed { width: 100%; flex: 1; min-height: 240px; font: 400 12px/1.5 var(--mono); resize: none; white-space: pre; tab-size: 4; }
.modal { position: fixed; inset: 0; background: rgba(2,6,23,.7); display: none; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal.on { display: flex; }
.dlg { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: min(640px, 100%); max-height: 90vh; overflow: auto; padding: 18px; }
.dlg h2 { font-size: 16px; margin-bottom: 10px; }
#lbl3d { position: absolute; inset: 0; overflow: hidden; pointer-events: none; display: none; z-index: 1; }
#lbl3d span { position: absolute; left: 0; top: 0; white-space: nowrap; font: 500 11px var(--mono); color: #e2e8f0; text-shadow: 0 0 3px #0b1220, 0 0 3px #0b1220, 0 0 6px #0b1220; will-change: transform; }
#lbl3d span.project { font-weight: 600; font-size: 12px; color: #86efac; }
#lbl3d span.target { color: #d8b4fe; }
#lbl3d span.file, #lbl3d span.function { font-size: 10px; color: #bfdbfe; }
#board { position: absolute; inset: 0; display: none; gap: 12px; padding: 12px; overflow-x: auto; align-items: flex-start; }
.col { flex: 0 0 270px; max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
.col.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.col.arch { opacity: .75; }
.colh { background: none; border: 0; border-bottom: 1px solid var(--border); text-align: left; padding: 10px 12px; width: 100%; color: var(--text); }
.colh b { font: 600 13px var(--mono); display: block; word-break: break-word; }
.colh span { font: 400 11px var(--mono); color: var(--text-dim); }
.colact { display: flex; gap: 6px; padding: 6px 12px 8px; border-bottom: 1px solid var(--border); }
.colb { overflow: auto; padding: 4px 8px 10px; }
.sect { font: 500 11px var(--mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin: 10px 0 4px; }
.dcard { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 3px 0; min-height: 32px; color: var(--text); word-break: break-word; }
.dcard:hover { border-color: var(--text-dim); }
.dcard.jb { border-left: 3px solid var(--runs); }
.dcard.proj { border-left: 3px solid var(--accent); } .dcard.tg { border-left: 3px solid var(--target); } .dcard.by { border-left: 3px solid var(--imports); }
.dcard .n { font: 400 11px var(--mono); color: var(--text-dim); flex: none; }
.ok { color: var(--accent); } .bad { color: var(--danger); }
/* file tree */
.tree { list-style: none; margin: 0; padding: 0; }
.tree .kids { list-style: none; margin: 0 0 0 14px; padding: 0 0 0 6px; border-left: 1px solid var(--border); }
.tree li { padding: 1px 0; }
.trow { display: flex; align-items: center; gap: 6px; border-radius: 6px; padding: 1px 4px; }
.trow > button.nm { background: none; border: 0; padding: 3px 2px; text-align: left; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow > button.nm:hover { color: var(--accent); }
.trow.dir > button.nm { font-weight: 500; }
.trow .go { background: none; border: 1px solid transparent; color: var(--text-dim); font: 400 11px var(--mono); padding: 1px 6px; border-radius: 4px; visibility: hidden; }
.trow:hover .go, .trow .go:focus-visible { visibility: visible; border-color: var(--border); }
.trow.over { background: rgba(34,197,94,.18); outline: 1px dashed var(--accent); }
.dropzone.over { outline: 2px dashed var(--accent); outline-offset: -2px; background: rgba(34,197,94,.06); }
/* chat jump button */
.chatwrap { position: relative; flex: 1; min-height: 160px; display: flex; flex-direction: column; }
.chatwrap .chatbox { flex: 1; min-height: 0; }
.latest { position: absolute; right: 14px; bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
/* full-width detail */
.app.wide { grid-template-columns: 1fr; }
.app.wide aside, .app.wide #viewport { display: none; }
.app.wide section.detail { border-left: 0; padding: 12px max(12px, calc((100vw - 1100px) / 2)); }
.tabs .sp { flex: 1; }
.tabs select { width: auto; max-width: 220px; min-height: 28px; align-self: center; padding: 3px 8px; }
.tabs .btn { align-self: center; margin-left: 4px; }
.tabs .btn, .tabs select { box-sizing: border-box; height: 30px; min-height: 30px; padding-top: 0; padding-bottom: 0; font-size: 12px; line-height: 1; }
.tabs .btn.back { margin: 0 8px 0 0; background: #3b82f6; color: #fff; font-weight: 600; }
.tabs .btn.back:hover { background: #2563eb; }
/* jobs */
.job { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; }
.job.off { border-left-color: var(--text-dim); opacity: .8; }
.job h4 { margin: 0 0 2px; font: 600 13px var(--mono); word-break: break-word; }
.job dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 4px 0; font: 400 12px var(--mono); color: var(--text-dim); }
.job dd { margin: 0; color: var(--text); word-break: break-word; }
@media (max-width: 1000px) { .app { grid-template-columns: 1fr; grid-template-rows: 48px 40vh 1fr auto; } aside, section.detail { max-height: 40vh; } .legend { left: 12px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>agentic<span>_</span>view</h1>
    <div class="seg" role="group" aria-label="View mode"><button id="vbd" aria-pressed="true">Board</button><button id="v2d" aria-pressed="false">2D</button><button id="v3d" aria-pressed="false">3D</button></div>
    <button class="btn ghost sm" id="b-rescan" hidden>Rescan</button>
    <button class="btn sm" id="b-new" hidden>New project</button>
    <button class="btn ghost sm" id="b-jobs" hidden title="All Windows Task Scheduler jobs that run a scanned file">Scheduler jobs</button>
    <button class="btn ghost sm" id="b-update" hidden title="Check GitHub for a newer version and update this app (no git needed)">Update</button>
    <button class="btn ghost sm" id="b-global" hidden title="Edit your global Claude instructions">Global CLAUDE.md</button>
    <button class="btn ghost sm" id="b-setup" hidden>Claude setup</button>
    <span class="tag warn" id="noserver" hidden title="Chat, Files and Scripts need the local server">viewer only: run start_windows.bat (or start_mac.command / start_ubuntu.sh) for chat, files, scripts</span>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>
  <aside aria-label="Filters and projects">
    <label class="lbl" for="q">Search</label>
    <input id="q" type="search" placeholder="project, file, function, target" autocomplete="off">
    <label class="lbl">Show</label>
    <label class="chk"><input type="checkbox" id="f-shared" checked> Shared targets only</label>
    <label class="chk"><input type="checkbox" id="f-env"> Env key names</label>
    <label class="chk"><input type="checkbox" id="f-arch" checked> Archived projects</label>
    <label class="chk"><input type="checkbox" id="f-heur" checked> Heuristic and doc links</label>
    <label class="chk" title="Only projects that have a Windows Task Scheduler job"><input type="checkbox" id="f-jobs"> Scheduler jobs only</label>
    <div class="row"><button class="btn ghost" id="b-expand">Expand all</button><button class="btn ghost" id="b-collapse">Collapse all</button></div>
    <label class="lbl">Projects</label>
    <ul class="plist" id="plist"></ul>
  </aside>
  <main id="viewport">
    <div id="cy" role="img" aria-label="Dependency graph of projects"></div>
    <div id="g3d" role="img" aria-label="3D dependency graph"></div>
    <div id="board" aria-label="Project board"></div>
    <div id="lbl3d" aria-hidden="true"></div>
    <div class="legend" aria-hidden="true">
      <span><i style="border-color:var(--imports)"></i>imports</span>
      <span><i style="border-color:var(--calls)"></i>calls</span>
      <span><i style="border-color:#38bdf8"></i>declared</span>
      <span><i style="border-color:var(--reads)"></i>reads files</span>
      <span><i style="border-color:var(--runs)"></i>runs</span>
      <span><i style="border-color:var(--target)"></i>uses target</span>
      <span>dashed = heuristic</span>
    </div>
  </main>
  <section class="detail" id="detail" aria-label="Details"></section>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="dlg" id="dlg"></div></div>

<!--AV_BOOT-->
<script src="../out/graph.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "text") e.textContent = props[k];
      else if (k === "class") e.className = props[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== false && props[k] !== null && props[k] !== undefined) e.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(function () { t.classList.remove("on"); }, 2400); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var AV = window.AV || null;            // present only when served by server/server.py
  var G = window.AGENTIC_GRAPH, IMP = window.AGENTIC_IMPACT || {};
  if (!G || typeof cytoscape === "undefined") {
    $("detail").style.display = "none";
    document.querySelector("aside").style.display = "none";
    $("viewport").replaceWith(el("div", { class: "empty" }, [
      el("h2", { text: "No scan data yet" }),
      el("p", { text: G ? "Cytoscape failed to load (check your connection)." : "Run the scanner, then reload this page:" }),
      G ? null : el("p", {}, [el("code", { text: "python scanner/scan.py --root <your projects folder>" })])
    ]));
    return;
  }

  /* ---------------------------------------------------------- api helpers */
  function hdr(json) { var h = { "X-AV-Token": AV.token }; if (json) h["Content-Type"] = "application/json"; return h; }
  function api(path, method, body) {
    return fetch(path, { method: method || "GET", headers: hdr(!!body), body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }
  function streamRun(id, onText, onEnd) {
    fetch("/api/run/" + id + "/stream?from=0", { headers: hdr() }).then(function (res) {
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = "";
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { onEnd(null); return; }
          buf += dec.decode(r.value, { stream: true });
          var i;
          while ((i = buf.indexOf("\n\n")) >= 0) {
            var ev = buf.slice(0, i); buf = buf.slice(i + 2);
            var name = "message", data = "";
            ev.split("\n").forEach(function (l) { if (l.indexOf("event: ") === 0) name = l.slice(7); else if (l.indexOf("data: ") === 0) data += l.slice(6); });
            if (!data) continue;
            var o = JSON.parse(data);
            if (name === "end") { onEnd(o.code); return; }
            onText(o.t);
          }
          return pump();
        });
      }
      return pump();
    }).catch(function (e) { onEnd("stream error: " + e.message); });
  }

  /* ---------------------------------------------------------- graph data */
  var nodes = {}; G.nodes.forEach(function (n) { nodes[n.id] = n; });
  var projects = G.nodes.filter(function (n) { return n.type === "project"; }).sort(function (a, b) { return a.id.toLowerCase() < b.id.toLowerCase() ? -1 : 1; });
  var hyg = {}; G.hygiene.forEach(function (h) { hyg[h.project] = h.issues; });
  var filesOf = {}, funcsOf = {};
  G.nodes.forEach(function (n) {
    if (n.type === "file") (filesOf[n.project] = filesOf[n.project] || []).push(n);
    else if (n.type === "function") (funcsOf[n.file] = funcsOf[n.file] || []).push(n);
  });
  var linked = {}; G.edges.forEach(function (e) { linked[e.from] = linked[e.to] = 1; });
  var jobProj = {}, jobsOf = {};   // projects that have a scheduler job (from the scan), and job labels per project
  G.edges.forEach(function (e) {
    var j = nodes[e.from], f = nodes[e.to];
    if (j && j.type === "job" && f && f.project) { jobProj[f.project] = 1; (jobsOf[f.project] = jobsOf[f.project] || {})[j.label] = j.schedule || ""; }
  });
  function hideProject(p) {
    return (p.archived && !$("f-arch").checked) || ($("f-jobs").checked && !jobProj[p.id]);
  }
  var expanded = {}, expandedFiles = {}, selected = null, tab = "info", view3d = false, mode = "bd";
  var m = G.meta;
  [["projects", m.projects], ["files", m.files], ["functions", m.functions || 0], ["targets", m.targets], ["edges", m.edges], ["scanned", m.generated]].forEach(function (s) {
    $("stats").appendChild(el("span", {}, [s[0] + " ", el("b", { text: String(s[1]) })]));
  });

  var KCOL = { imports: "#60a5fa", reads_file: "#fbbf24", runs: "#22c55e", uses_target: "#c084fc", calls: "#f472b6", declared: "#38bdf8" };
  var cy = cytoscape({
    container: $("cy"), wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 4,
    style: [

      if (!r.scripts.length) { listBox.textContent = "No runnable scripts found in the scan."; return; }
      var ul = el("ul");
      r.scripts.forEach(function (s) {
        var runBtn = el("button", { class: "btn sm", text: "Run", disabled: AV.readOnly ? "disabled" : false });
        var stopBtn = el("button", { class: "btn ghost sm", text: "Stop", disabled: "disabled" });
        var runId = null;
        runBtn.addEventListener("click", function () {
          if (!window.confirm("Run " + s.path + " now?\n\nThe script runs on this computer with your permissions.")) return;
          out.textContent = "$ " + s.path + "\n[running, waiting for output]\n"; runBtn.disabled = true;
          api("/api/run", "POST", { kind: "script", file_id: s.id, confirm: true }).then(function (rr) {
            runId = rr.id; stopBtn.disabled = false;
            streamRun(rr.id, function (t) { out.appendChild(document.createTextNode(t)); out.scrollTop = out.scrollHeight; },
              function (code) { out.appendChild(document.createTextNode("\n[exit " + code + (code === 0 ? ", finished" : "") + "]\n")); out.scrollTop = out.scrollHeight; runBtn.disabled = AV.readOnly; stopBtn.disabled = true; });
          }).catch(function (e) { out.textContent += "error: " + e.message + "\n"; runBtn.disabled = false; });
        });
        stopBtn.addEventListener("click", function () { if (runId) api("/api/run/" + runId + "/stop", "POST", {}); });
        ul.appendChild(el("li", { style: "display:flex;gap:6px;align-items:center;justify-content:space-between" }, [el("span", { text: s.path, style: "overflow:hidden;text-overflow:ellipsis" }), el("span", { style: "display:flex;gap:4px;flex:none" }, [runBtn, stopBtn])]));
      });
      listBox.appendChild(ul);
    }).catch(function (e) { listBox.textContent = e.message; });
    return wrap;
  }

  /* ---------------------------------------------------------- scheduler jobs */
  // pid = "" lists every project's jobs. Live data from Windows Task Scheduler via the server.
  function jobsList(box, pid) {
    var head = el("div", { class: "row", style: "margin:0 0 8px" });
    var list = el("div", {});
    var refresh = el("button", { class: "btn ghost sm", text: "Refresh" });
    var filter = el("input", { type: "search", placeholder: "filter jobs", "aria-label": "Filter jobs", style: "max-width:240px" });
    var info = el("span", { class: "sub" });
    [refresh, filter, info].forEach(function (x) { head.appendChild(x); });
    box.appendChild(head); box.appendChild(list);
    var jobs = [];
    function act(j, action, label) {
      var msg = label + ' "' + j.label + '"?' + (action === "run" ? "\n\nIt runs " + j.script + " on this computer now, with the task's own account." : "");
      if (!window.confirm(msg)) return;
      api("/api/job", "POST", { name: j.name, action: action, confirm: true }).then(function (r) {
        toast(label + " done" + (r.output ? ": " + r.output : "")); setTimeout(load, action === "run" ? 1500 : 200);
      }).catch(function (e) { toast(label + " failed: " + e.message); });
    }
    function draw() {
      var q = filter.value.toLowerCase(); list.innerHTML = "";
      var shown = jobs.filter(function (j) { return !q || (j.label + " " + j.script + " " + j.projects.join(" ")).toLowerCase().indexOf(q) >= 0; });
      if (!shown.length) { list.appendChild(el("div", { class: "sub", text: jobs.length ? "No job matches the filter." : "No Task Scheduler job runs a scanned file" + (pid ? " of this project." : ".") })); return; }
      shown.forEach(function (j) {
        var dl = el("dl", {});
        [["Schedule", j.schedule], ["Next run", j.next], ["Last run", j.last], ["Last result", j.result], ["Status", j.status], ["Runs", j.script + (pid ? "" : "  (" + j.projects.join(", ") + ")")]].forEach(function (kv) {
          if (kv[1]) { dl.appendChild(el("dt", { text: kv[0] })); dl.appendChild(el("dd", { text: kv[1] })); }
        });
        var ro = AV.readOnly ? "disabled" : false;
        var btns = el("div", { class: "row", style: "margin:4px 0 0" }, [
          el("button", { class: "btn sm", text: "Run now", disabled: ro, onclick: function () { act(j, "run", "Run now"); } }),
          el("button", { class: "btn ghost sm", text: j.enabled ? "Disable" : "Enable", disabled: ro, onclick: function () { act(j, j.enabled ? "disable" : "enable", j.enabled ? "Disable" : "Enable"); } })
        ]);
        list.appendChild(el("div", { class: "job" + (j.enabled ? "" : " off") }, [
          el("h4", {}, [j.label, el("span", { class: "tag" + (j.enabled ? "" : " warn"), text: j.enabled ? "enabled" : "disabled" })]), dl, btns]));
      });
    }
    function load() {
      info.textContent = "loading Task Scheduler (can take a few seconds)"; refresh.disabled = true;
      api("/api/jobs?project=" + encodeURIComponent(pid || "")).then(function (r) {
        jobs = r.jobs; info.textContent = r.note || (jobs.length + " job" + (jobs.length === 1 ? "" : "s")) + (r.readOnly ? ", read-only server" : ""); draw();
      }).catch(function (e) { info.textContent = "error: " + e.message; }).then(function () { refresh.disabled = false; });
    }
    refresh.addEventListener("click", load); filter.addEventListener("input", draw);
    load();
  }
  function jobsPanel(pid) {
    var wrap = el("div", { class: "tabbody", style: "gap:8px" });
    wrap.appendChild(el("div", { class: "sub", text: "Windows Task Scheduler jobs that run a file of this project. Run now, Enable and Disable ask for confirmation." }));
    var box = el("div", { style: "overflow:auto;flex:1;min-height:0" });
    wrap.appendChild(box); jobsList(box, pid);
    return wrap;
  }
  function openAllJobs() {
    showModal(function (d) {
      d.appendChild(el("h2", { id: "mtitle", text: "Scheduler jobs, all projects" }));
      var box = el("div", {}); d.appendChild(box); jobsList(box, "");
      d.appendChild(el("div", { class: "row" }, [el("button", { class: "btn ghost", text: "Close", onclick: closeModal })]));
    });
  }

  /* ---------------------------------------------------------- update from GitHub */
  function openUpdate() {
    showModal(function (d) {
      d.appendChild(el("h2", { id: "mtitle", text: "Update Agentic View" }));
      var body = el("div", {}), actions = el("div", { class: "row" });
      var close = el("button", { class: "btn ghost", text: "Close", onclick: closeModal });
      d.appendChild(body); d.appendChild(actions);
      body.appendChild(el("p", { class: "sub", text: "checking GitHub" })); actions.appendChild(close);
      api("/api/update/check").then(function (u) {
        body.innerHTML = "";
        body.appendChild(el("p", {}, ["Installed: ", el("b", { text: "v" + (u.current || "unknown") }), "   Latest: ", el("b", { text: u.latest ? "v" + u.latest : "unknown" })]));
        if (u.error) { body.appendChild(el("p", { class: "bad", text: u.error })); return; }
        if (!u.newer) { body.appendChild(el("p", { class: "ok", text: "You are on the latest version." })); return; }
        if (u.isClone) {
          body.appendChild(el("p", { text: "This folder is a git clone, so update it with:" }));
          body.appendChild(el("p", {}, [el("code", { class: "k", text: "git pull" })]));
          return;
        }
        body.appendChild(el("p", { text: "A newer version is available. The update downloads it from github.com/" + u.repo + " and replaces the app files only. Your scan settings (config.local.json), scan results, projects, CLAUDE.md and handover notes are not touched. The old files are saved under out/backups first." }));
        var go = el("button", { class: "btn", text: "Update to v" + u.latest, disabled: AV.readOnly ? "disabled" : false });
        if (AV.readOnly) body.appendChild(el("p", { class: "sub", text: "Read-only server: updating is disabled." }));
        go.addEventListener("click", function () {
          if (!window.confirm("Download v" + u.latest + " from GitHub, replace the app files and restart the server?\n\nLive chat sessions end now and resume on your next message. This page reloads by itself.")) return;
          go.disabled = true; close.disabled = true; body.appendChild(el("p", { class: "sub", text: "downloading and installing" }));
          api("/api/update", "POST", { version: "v" + u.latest, confirm: true }).then(function (r) {
            body.innerHTML = ""; go.remove();
            body.appendChild(el("p", { class: "ok", text: "Updated to v" + r.updated + " (" + r.files + " files). Old files saved under " + r.backup + "." }));
            if (r.pending.length) body.appendChild(el("p", { class: "bad", text: "Could not replace while running: " + r.pending.join(", ") + ". After stopping the server, rename the .av-new copy next to each over the original." }));
            var st = el("p", { class: "sub", text: "restarting the server, this page reloads by itself" });
            body.appendChild(st);
            var t0 = Date.now();
            (function wait() {
              setTimeout(function () {
                fetch("/", { cache: "no-store" }).then(function (x) { return x.text(); }).then(function (h) {
                  if (h.indexOf('"version": "' + r.updated + '"') >= 0) { st.textContent = "restarted, reloading"; location.reload(); } else again();
                }).catch(again);
              }, 1000);
              function again() {
                if (Date.now() - t0 > 60000) { st.className = "bad"; st.textContent = "The server did not come back. Run your launcher again (start_windows.bat, start_mac.command or start_ubuntu.sh), then reload this page."; close.disabled = false; return; }
                wait();
              }
            })();
          }).catch(function (e) { go.disabled = false; close.disabled = false; body.appendChild(el("p", { class: "bad", text: "update failed: " + e.message })); });
        });
        actions.insertBefore(go, close);
      }).catch(function (e) { body.innerHTML = ""; body.appendChild(el("p", { class: "bad", text: "check failed: " + e.message })); });
    });
  }

  /* ---------------------------------------------------------- setup + rescan */
  function showModal(build) { var d = $("dlg"); d.innerHTML = ""; build(d); $("modal").classList.add("on"); }
  function closeModal() { $("modal").classList.remove("on"); }
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  function runInModal(d, body, doneMsg, after) {
    var out = el("div", { class: "term", style: "max-height:260px;margin-top:10px" }), st = el("div", { class: "sub", text: "starting" });
    d.appendChild(out); d.appendChild(st);
    return api("/api/run", "POST", body).then(function (r) {
      var urlShown = false;
      st.textContent = "running";
      streamRun(r.id, function (t) {
        out.appendChild(document.createTextNode(t)); out.scrollTop = out.scrollHeight;
        if (body.kind === "login" && !urlShown) { var mm = /https:\/\/[^\s"]+/.exec(out.textContent); if (mm) { urlShown = true; d.appendChild(el("p", {}, ["Open to sign in: ", el("a", { href: mm[0], target: "_blank", rel: "noopener noreferrer", text: "claude.ai sign-in", style: "color:var(--accent)" })])); } }
      }, function (code) { st.textContent = (code === 0 ? doneMsg : "finished with code " + code); if (after) after(code); });
      if (body.kind === "login") {
        var inp = el("input", { type: "text", placeholder: "paste the code here if asked, then Send", "aria-label": "Login code" });
        d.appendChild(el("div", { class: "row" }, [inp, el("button", { class: "btn sm", text: "Send", onclick: function () { api("/api/run/" + r.id + "/stdin", "POST", { text: inp.value + "\n" }); inp.value = ""; } })]));
      }
    }).catch(function (e) { st.textContent = "error: " + e.message; });
  }

  function openGlobal() {
    api("/api/global-claude").then(function (g) {
      showModal(function (d) {
        d.appendChild(el("h2", { id: "mtitle", text: "Global CLAUDE.md" }));
        d.appendChild(el("div", { class: "sub", text: g.path }));
        d.appendChild(el("div", { class: "banner", text: "These instructions apply to every Claude session you start, in every project. Live sessions in this app keep the old text until you end and restart them. The previous version is saved under out/backups/global." }));
        var ta = el("textarea", { class: "ed", spellcheck: "false", "aria-label": "Global CLAUDE.md", style: "min-height:380px;width:100%" });
        ta.value = g.content;
        if (g.readOnly) ta.readOnly = true;
        var st = el("div", { class: "sub", text: g.exists ? "loaded" + (g.crlf ? " (CRLF line endings kept on save)" : "") : "file does not exist yet, saving creates it" });
        var hash = g.hash, dirty = false;
        var save = el("button", { class: "btn", text: "Save", disabled: "disabled" });
        ta.addEventListener("input", function () { dirty = true; save.disabled = !!g.readOnly; st.textContent = "unsaved changes"; });
        save.addEventListener("click", function () {
          if (!window.confirm("Save changes to your global CLAUDE.md?\n\nThis changes how Claude behaves in every project.")) return;
          save.disabled = true; st.textContent = "saving";
          api("/api/global-claude", "POST", { content: ta.value, hash: hash, confirm: true }).then(function (r) {
            hash = r.hash; dirty = false; st.textContent = "saved. Previous version kept under out/backups/global."; toast("Saved global CLAUDE.md");
          }).catch(function (e) { save.disabled = false; st.textContent = "save failed: " + e.message; });
        });
        function close() { if (dirty && !window.confirm("Discard unsaved changes?")) return; closeModal(); }
        [ta, st, el("div", { class: "row" }, [save, el("button", { class: "btn ghost", text: "Close", onclick: close })])].forEach(function (x) { d.appendChild(x); });
      });
    }).catch(function (e) { toast("global CLAUDE.md: " + e.message); });
  }

  function openNewProject() {
    var names = projects.filter(function (p) { return !p.archived; }).map(function (p) { return p.id; });
    showModal(function (d) {
      d.appendChild(el("h2", { id: "mtitle", text: "New project" }));
      var name = el("input", { type: "text", placeholder: "Project name (becomes the folder name)", "aria-label": "Project name", maxlength: "60" });
      var goal = el("textarea", { rows: "3", placeholder: "Goal: what should this project achieve?", "aria-label": "Goal" });
      var tasks = el("textarea", { rows: "5", placeholder: "Tasks, one per line", "aria-label": "Tasks" });
      var checks = {}, rl = el("div", { class: "card", style: "max-height:180px;overflow:auto;margin:0" });
      var filter = el("input", { type: "search", placeholder: "filter related projects", "aria-label": "Filter related projects" });
      function drawRel() {
        var q = filter.value.toLowerCase(); rl.innerHTML = "";
        names.filter(function (n) { return !q || n.toLowerCase().indexOf(q) >= 0; }).forEach(function (n) {
          var cb = el("input", { type: "checkbox" }); cb.checked = !!checks[n];
          cb.addEventListener("change", function () { checks[n] = cb.checked; });
          rl.appendChild(el("label", { class: "chk" }, [cb, n]));
        });
      }
      filter.addEventListener("input", drawRel); drawRel();
      var st = el("div", { class: "sub", text: "Creates the folder with Brief/, Deliverables/, Handover/, CLAUDE.md (goal, tasks, related projects) and architecture.md, then rescans." });
      var create = el("button", { class: "btn", text: "Create project" });
      create.addEventListener("click", function () {
        var body = { name: name.value, goal: goal.value, tasks: tasks.value.split("\n"), related: names.filter(function (n) { return checks[n]; }) };
        create.disabled = true; st.textContent = "creating";
        api("/api/project/new", "POST", body).then(function (r) {
          store("av.prefill." + r.id, "Read CLAUDE.md and Handover/Handover.md. Read the CLAUDE.md and architecture.md of each related project and check what they offer with the impact tool. Then propose a short plan for Task 1 and ask me anything unclear before you build.");
          st.textContent = "created. Rescanning";
          runInModal(d, { kind: "scan" }, "done. Opening the project.", function (code) {
            if (code === 0) setTimeout(function () { location.hash = "open=" + encodeURIComponent(r.id) + "&tab=chat"; location.reload(); }, 600);
          });
        }).catch(function (e) { st.textContent = "failed: " + e.message; create.disabled = false; });
      });
      [el("label", { class: "lbl", text: "Name" }), name, el("label", { class: "lbl", text: "Goal" }), goal, el("label", { class: "lbl", text: "Tasks" }), tasks,
       el("label", { class: "lbl", text: "Related projects it will use (optional)" }), filter, rl,
       el("div", { class: "row" }, [create, el("button", { class: "btn ghost", text: "Cancel", onclick: closeModal })]), st].forEach(function (x) { d.appendChild(x); });
    });
  }

  function openSetup() {
    api("/api/state").then(function (s) {
      showModal(function (d) {
        d.appendChild(el("h2", { id: "mtitle", text: "Claude setup" }));
        var c = s.claude;
        d.appendChild(el("p", {}, ["Installed: ", el("b", { class: c.installed ? "ok" : "bad", text: c.installed ? "yes, " + c.version : "no" })]));
        d.appendChild(el("p", {}, ["Signed in: ", el("b", { class: c.loggedIn ? "ok" : "bad", text: c.loggedIn ? "yes (" + (c.auth.authMethod || "account") + ")" : "no" })]));
        var actions = el("div", { class: "row" });
        if (!c.installed) {
          d.appendChild(el("p", { text: "This will run the official installer on this computer:" }));
          d.appendChild(el("p", {}, [el("code", { class: "k", text: s.install.command })]));
          actions.appendChild(el("button", { class: "btn", text: "Install Claude", disabled: s.readOnly ? "disabled" : false, onclick: function () {
            if (!window.confirm("Run this command on your computer?\n\n" + s.install.command)) return;
            actions.remove(); runInModal(d, { kind: "install", confirm_command: s.install.command }, "install finished. Close and reopen this dialog.", function () { }); } }));
        } else if (!c.loggedIn) {
          actions.appendChild(el("button", { class: "btn", text: "Sign in with Claude", onclick: function () { actions.remove(); runInModal(d, { kind: "login" }, "sign-in finished. Reopen this dialog to confirm.", function () { }); } }));
        } else d.appendChild(el("p", { class: "ok", text: "Ready. Use the Chat tab on any project." }));
        actions.appendChild(el("button", { class: "btn ghost", text: "Close", onclick: closeModal }));
        d.appendChild(actions);
      });
    }).catch(function (e) { toast("setup: " + e.message); });
  }

  function rescan() {
    showModal(function (d) {
      d.appendChild(el("h2", { id: "mtitle", text: "Rescan" }));
      runInModal(d, { kind: "scan" }, "done. Reloading.", function (code) { if (code === 0) setTimeout(function () { location.reload(); }, 800); });
      d.appendChild(el("div", { class: "row" }, [el("button", { class: "btn ghost", text: "Close", onclick: closeModal })]));
    });
  }

  if (AV && AV.version) document.querySelector("header h1").appendChild(el("small", { text: " v" + AV.version, style: "font-weight:400;color:var(--text-dim)" }));
  if (!AV) $("noserver").hidden = false;
  if (AV) {
    $("b-rescan").hidden = false; $("b-setup").hidden = false; $("b-new").hidden = !!AV.readOnly;
    $("b-new").addEventListener("click", openNewProject);
    $("b-jobs").hidden = false; $("b-jobs").addEventListener("click", openAllJobs);
    $("b-update").hidden = false; $("b-update").addEventListener("click", openUpdate);
    api("/api/update/check").then(function (u) {
      if (u.newer) { $("b-update").textContent = "Update v" + u.latest; $("b-update").classList.remove("ghost"); }
    }).catch(function () {});
    $("b-global").hidden = false; $("b-global").addEventListener("click", openGlobal);
    $("b-rescan").addEventListener("click", rescan);
    $("b-setup").addEventListener("click", openSetup);
    api("/api/state").then(function (s) {
      if (!s.claude.installed || !s.claude.loggedIn) { $("b-setup").textContent = "Claude setup (needed)"; $("b-setup").classList.remove("ghost"); }
    }).catch(function () {});
  }

  /* ---------------------------------------------------------- wiring */
  cy.on("tap", "node", function (ev) { selectNode(ev.target.id(), false); });
  cy.on("dbltap", "node[type='project']", function (ev) { var id = ev.target.id(); expanded[id] = !expanded[id]; build(); selectNode(id, true); });
  cy.on("dbltap", "node[type='file']", function (ev) { var n = nodes[ev.target.id()]; if ((funcsOf[n.id] || []).length) { expandedFiles[n.id] = !expandedFiles[n.id]; build(); selectNode(n.id, true); } });
  cy.on("tap", function (ev) { if (ev.target === cy) { clearHL(); selected = null; renderList(); renderPanel(); cy.elements().unselect(); } });
  ["f-shared", "f-env", "f-arch", "f-heur", "f-jobs"].forEach(function (i) { $(i).addEventListener("change", build); });
  var qt; $("q").addEventListener("input", function () { clearTimeout(qt); qt = setTimeout(build, 200); });
  $("b-expand").addEventListener("click", function () { projects.forEach(function (p) { if ((filesOf[p.id] || []).length < 80) expanded[p.id] = true; }); build(); });
  $("b-collapse").addEventListener("click", function () { expanded = {}; expandedFiles = {}; build(); });

  build();
  setMode("bd");
  (function openFromHash() {
    var hm = /open=([^&]+)/.exec(location.hash || ""), tm = /tab=([a-z]+)/.exec(location.hash || "");
    if (hm && AV) { var pid = decodeURIComponent(hm[1]); if (nodes[pid]) { tab = tm ? tm[1] : "info"; selectNode(pid, false); history.replaceState(null, "", location.pathname); return; } }
    renderPanel();
  })();
})();
</script>
</body>
</html>
