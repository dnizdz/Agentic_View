<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1220; --panel: #0f172a; --card: #1b2336; --muted: #272f42;
  --border: #334155; --text: #f8fafc; --text-dim: #94a3b8;
  --accent: #22c55e; --imports: #60a5fa; --reads: #fbbf24; --runs: #22c55e; --target: #c084fc;
  --danger: #ef4444;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, Segoe UI, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 280px 1fr 360px; grid-template-rows: 48px 1fr; height: 100%; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { margin: 0; font: 600 15px var(--mono); letter-spacing: .02em; }
header h1 span { color: var(--accent); }
.stats { display: flex; gap: 14px; color: var(--text-dim); font: 400 12px var(--mono); margin-left: auto; flex-wrap: wrap; }
.stats b { color: var(--text); font-weight: 500; }
aside, section.detail { background: var(--panel); overflow: auto; padding: 12px; }
aside { border-right: 1px solid var(--border); }
section.detail { border-left: 1px solid var(--border); }
#cy { background: radial-gradient(circle at 50% 40%, #111a2e 0%, var(--bg) 70%); min-height: 0; }
label.lbl { display: block; font: 500 11px var(--mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
input[type=search] { width: 100%; padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 5px 0; min-height: 32px; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li button { width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; min-height: 32px; display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
.plist li button:hover { background: var(--muted); }
.plist li button[aria-pressed=true] { background: var(--muted); box-shadow: inset 2px 0 var(--accent); }
.plist .n { color: var(--text-dim); font: 400 12px var(--mono); flex: none; }
.plist .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arch { color: var(--text-dim); font-style: italic; }
h2 { font: 600 15px var(--mono); margin: 0 0 4px; word-break: break-word; }
.sub { color: var(--text-dim); font: 400 12px var(--mono); word-break: break-all; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.card h3 { margin: 0 0 6px; font: 500 11px var(--mono); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
.card ul { list-style: none; padding: 0; margin: 0; }
.card li { padding: 3px 0; word-break: break-word; }
.card li button { background: none; border: 0; padding: 2px 0; text-align: left; color: var(--text); }
.card li button:hover { color: var(--accent); text-decoration: underline; }
.tag { font: 500 10px var(--mono); padding: 1px 6px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-dim); margin-left: 6px; }
.tag.warn { color: var(--reads); border-color: var(--reads); }
.btn { background: var(--accent); color: #052e16; border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; min-height: 36px; }
.btn.ghost { background: var(--muted); color: var(--text); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.empty { max-width: 560px; margin: 12vh auto; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.empty code { font-family: var(--mono); background: var(--muted); padding: 2px 6px; border-radius: 4px; }
.legend { position: absolute; left: 292px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; background: rgba(15,23,42,.85); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: 400 11px var(--mono); color: var(--text-dim); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; font: 400 12px var(--mono); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
@media (max-width: 1000px) { .app { grid-template-columns: 1fr; grid-template-rows: 48px 40vh 1fr auto; } aside, section.detail { max-height: 30vh; } .legend { left: 12px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>agentic<span>_</span>view</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>
  <aside aria-label="Filters and projects">
    <label class="lbl" for="q">Search</label>
    <input id="q" type="search" placeholder="project, file, target" autocomplete="off">
    <label class="lbl">Show</label>
    <label class="chk"><input type="checkbox" id="f-shared" checked> Shared targets only</label>
    <label class="chk"><input type="checkbox" id="f-env"> Env key names</label>
    <label class="chk"><input type="checkbox" id="f-arch" checked> Archived projects</label>
    <label class="chk"><input type="checkbox" id="f-heur" checked> Heuristic and doc links</label>
    <div class="row"><button class="btn ghost" id="b-expand">Expand all</button><button class="btn ghost" id="b-collapse">Collapse all</button></div>
    <label class="lbl">Projects</label>
    <ul class="plist" id="plist"></ul>
  </aside>
  <main style="position:relative;min-height:0"><div id="cy" style="position:absolute;inset:0" role="img" aria-label="Dependency graph of projects"></div>
    <div class="legend" aria-hidden="true">
      <span><i style="border-color:var(--imports)"></i>imports</span>
      <span><i style="border-color:var(--reads)"></i>reads files</span>
      <span><i style="border-color:var(--runs)"></i>runs</span>
      <span><i style="border-color:var(--target)"></i>uses target</span>
      <span>dashed = heuristic</span>
    </div>
  </main>
  <section class="detail" id="detail" aria-label="Details"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="../out/graph.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "text") e.textContent = props[k];
      else if (k === "class") e.className = props[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(function () { t.classList.remove("on"); }, 1800); }

  var G = window.AGENTIC_GRAPH, IMP = window.AGENTIC_IMPACT || {};
  if (!G || typeof cytoscape === "undefined") {
    var d = $("detail"); d.style.display = "none";
    document.querySelector("aside").style.display = "none";
    $("cy").replaceWith(el("div", { class: "empty" }, [
      el("h2", { text: "No scan data yet" }),
      el("p", { text: G ? "Cytoscape failed to load (check your connection)." : "Run the scanner, then reload this page:" }),
      G ? null : el("p", {}, [el("code", { text: "python scanner/scan.py --root <your projects folder>" })])
    ]));
    return;
  }

  var nodes = {}; G.nodes.forEach(function (n) { nodes[n.id] = n; });
  var projects = G.nodes.filter(function (n) { return n.type === "project"; }).sort(function (a, b) { return a.id.toLowerCase() < b.id.toLowerCase() ? -1 : 1; });
  var hyg = {}; G.hygiene.forEach(function (h) { hyg[h.project] = h.issues; });
  var filesOf = {}; G.nodes.forEach(function (n) { if (n.type === "file") (filesOf[n.project] = filesOf[n.project] || []).push(n); });
  var expanded = {}, selected = null;
  var m = G.meta;
  $("stats").innerHTML = "";
  [["projects", m.projects], ["files", m.files], ["targets", m.targets], ["edges", m.edges], ["scanned", m.generated]].forEach(function (s) {
    $("stats").appendChild(el("span", {}, [s[0] + " ", el("b", { text: String(s[1]) })]));
  });

  var KCOL = { imports: "#60a5fa", reads_file: "#fbbf24", runs: "#22c55e", uses_target: "#c084fc" };
  var cy = cytoscape({
    container: $("cy"), wheelSensitivity: 0.25, minZoom: 0.05, maxZoom: 4,
    style: [
      { selector: "node", style: { label: "data(label)", color: "#e2e8f0", "font-family": "JetBrains Mono, monospace", "font-size": 11, "text-valign": "bottom", "text-margin-y": 4, "text-wrap": "ellipsis", "text-max-width": 130, "min-zoomed-font-size": 7 } },
      { selector: "node[type='project']", style: { shape: "round-rectangle", "background-color": "#1b2336", "border-width": 1.5, "border-color": "#22c55e", width: "mapData(files, 0, 300, 46, 100)", height: "mapData(files, 0, 300, 46, 100)", "font-size": 13, "font-weight": 600, "min-zoomed-font-size": 0, "text-max-width": 160, "text-outline-color": "#0b1220", "text-outline-width": 3, "background-opacity": 0.9 } },
      { selector: "node[type='project'][?archived]", style: { "border-color": "#64748b", "border-style": "dashed", color: "#94a3b8" } },
      { selector: "node[type='project'][?open]", style: { "background-opacity": 0.12, "border-width": 1, "text-valign": "top", "text-margin-y": -4, padding: 16 } },
      { selector: "node[type='file']", style: { shape: "ellipse", width: 12, height: 12, "background-color": "#60a5fa", "font-size": 9, "text-max-width": 90 } },
      { selector: "node[type='file'][lang='shell']", style: { "background-color": "#22c55e" } },
      { selector: "node[type='file'][lang='js'], node[type='file'][lang='ts'], node[type='file'][lang='appsscript']", style: { "background-color": "#fbbf24" } },
      { selector: "node[type='target']", style: { shape: "diamond", width: 22, height: 22, "background-color": "#c084fc", "font-size": 10, color: "#d8b4fe", "text-outline-color": "#0b1220", "text-outline-width": 2, "min-zoomed-font-size": 9 } },
      { selector: "node[type='job']", style: { shape: "hexagon", width: 20, height: 20, "background-color": "#22c55e", "font-size": 10 } },
      { selector: "edge", style: { width: "mapData(count, 1, 40, 1, 5)", "line-color": "data(color)", "target-arrow-color": "data(color)", "target-arrow-shape": "triangle", "curve-style": "bezier", opacity: 0.6, "arrow-scale": 0.8 } },
      { selector: "edge[?loose]", style: { "line-style": "dashed" } },
      { selector: "edge[kind='uses_target']", style: { opacity: 0.35 } },
      { selector: ".dim", style: { opacity: 0.08 } },
      { selector: ".hit", style: { "border-width": 3, "border-color": "#f8fafc", opacity: 1 } },
      { selector: "edge.hit", style: { opacity: 1, width: 3 } },
      { selector: ":selected", style: { "border-width": 3, "border-color": "#ffffff" } }
    ]
  });

  function rep(id) {
    var n = nodes[id]; if (!n) return null;
    if (n.type === "file") return expanded[n.project] ? id : n.project;
    return id;
  }
  function sharedTargets() {
    var users = {};
    G.edges.forEach(function (e) {
      var t = nodes[e.to], f = nodes[e.from];
      if (t && t.type === "target" && f && f.project) (users[t.id] = users[t.id] || {})[f.project] = 1;
    });
    return users;
  }
  var tUsers = sharedTargets();

  function build() {
    var showShared = $("f-shared").checked, showEnv = $("f-env").checked, showArch = $("f-arch").checked, showHeur = $("f-heur").checked;
    var q = $("q").value.trim().toLowerCase();
    var els = [], seenN = {}, vis = {};
    function addNode(n) {
      if (seenN[n.id]) return; seenN[n.id] = 1;
      var d = { id: n.id, label: n.label, type: n.type, files: n.files || 0, archived: !!n.archived, lang: n.lang || "", open: !!expanded[n.id] };
      if (n.type === "file") d.parent = n.project;
      els.push({ group: "nodes", data: d });
    }
    projects.forEach(function (p) {
      if (p.archived && !showArch) return;
      vis[p.id] = 1;
      if (q && p.id.toLowerCase().indexOf(q) < 0 && !(filesOf[p.id] || []).some(function (f) { return f.id.toLowerCase().indexOf(q) >= 0; })) return;
      vis[p.id] = 2;
      addNode(p);
      if (expanded[p.id]) (filesOf[p.id] || []).forEach(function (f) { if (hasLink(f.id)) addNode(f); });
    });
    var linked = {};
    function hasLink(id) { if (!linked.built) { G.edges.forEach(function (e) { linked[e.from] = linked[e.to] = 1; }); linked.built = 1; } return !!linked[id]; }
    var agg = {};
    G.edges.forEach(function (e) {
      if (!showHeur && (e.confidence === "heuristic" || e.confidence === "doc")) return;
      var tn = nodes[e.to], fn = nodes[e.from]; if (!tn || !fn) return;
      if (tn.type === "target") {
        if (tn.tkind === "env" && !showEnv) return;
        if (showShared && Object.keys(tUsers[tn.id] || {}).length < 2) return;
      }
      var a = rep(e.from), b = rep(e.to); if (!a || !b || a === b) return;
      var pa = nodes[a].project || a, pb = nodes[b].project || b;
      if ((vis[pa] !== 2 && nodes[a].type !== "job") || (nodes[b].type !== "target" && nodes[b].type !== "job" && vis[pb] !== 2)) return;
      if (nodes[a].type === "file" && !seenN[a]) addNode(nodes[a]);
      if (nodes[b].type === "file" && !seenN[b]) addNode(nodes[b]);
      var k = a + "|" + b + "|" + e.kind;
      var o = agg[k] = agg[k] || { source: a, target: b, kind: e.kind, count: 0, loose: true };
      o.count++; if (e.confidence === "exact" || e.confidence === "resolved") o.loose = false;
    });
    Object.keys(agg).forEach(function (k) {
      var o = agg[k];
      addNode(nodes[o.source]); addNode(nodes[o.target]);
      els.push({ group: "edges", data: { id: k, source: o.source, target: o.target, kind: o.kind, count: o.count, color: KCOL[o.kind] || "#64748b", loose: o.loose } });
    });
    cy.elements().remove();
    cy.add(els);
    cy.layout({ name: "cose", animate: false, nodeRepulsion: function () { return 40000; }, idealEdgeLength: function () { return 170; }, nodeOverlap: 30, numIter: 1500, gravity: 0.4, nodeDimensionsIncludeLabels: true, randomize: true, fit: true, padding: 30 }).run();
    renderList();
  }

  function renderList() {
    var ul = $("plist"); ul.innerHTML = "";
    projects.forEach(function (p) {
      var b = el("button", { "aria-pressed": String(selected === p.id), onclick: function () { selectNode(p.id, true); } }, [
        el("span", { class: "nm" + (p.archived ? " arch" : ""), text: p.label }),
        el("span", { class: "n", text: String(p.files) })
      ]);
      ul.appendChild(el("li", {}, [b]));
    });
  }

  function clearHL() { cy.elements().removeClass("dim hit"); }
  function highlight(id) {
    clearHL();
    var imp = IMP[id]; if (!imp) return;
    var set = {}; set[id] = 1;
    imp.transitive.concat(imp.direct).forEach(function (x) { set[rep(x) || x] = 1; });
    (imp.targets || []).forEach(function (t) { set[t] = 1; });
    cy.elements().addClass("dim");
    cy.nodes().forEach(function (n) { if (set[n.id()]) n.removeClass("dim").addClass("hit"); });
    cy.edges().forEach(function (e) { if (set[e.source().id()] && set[e.target().id()]) e.removeClass("dim").addClass("hit"); });
  }

  function list(title, items, onclick, max) {
    if (!items.length) return null;
    var ul = el("ul");
    items.slice(0, max || 60).forEach(function (it) {
      ul.appendChild(el("li", {}, [onclick ? el("button", { text: it.label || it, onclick: function () { onclick(it.id || it); } }) : el("span", { text: it.label || it }), it.tag ? el("span", { class: "tag", text: it.tag }) : null]));
    });
    if (items.length > (max || 60)) ul.appendChild(el("li", { class: "sub", text: "+" + (items.length - (max || 60)) + " more" }));
    return el("div", { class: "card" }, [el("h3", { text: title + " (" + items.length + ")" }), ul]);
  }

  function selectNode(id, focus) {
    selected = id; var n = nodes[id], d = $("detail"); d.innerHTML = "";
    if (!n) return;
    var node = cy.getElementById(id);
    if (!node.length && n.type === "file") { expanded[n.project] = true; build(); node = cy.getElementById(id); }
    if (node.length && focus) { cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 0.9) }, { duration: 250 }); node.select(); }
    highlight(id); renderList();
    d.appendChild(el("h2", { text: n.type === "file" ? n.label : n.id }));
    d.appendChild(el("div", { class: "sub", text: n.type + (n.path ? " - " + n.path : "") + (n.archived ? " - archived" : "") }));
    if (n.type === "project") {
      if (n.summary) d.appendChild(el("p", { text: n.summary }));
      var row = el("div", { class: "row" }, [
        el("button", { class: "btn", text: expanded[id] ? "Collapse files" : "Expand files", onclick: function () { toggle(id); } }),
        el("button", { class: "btn ghost", text: "Copy Claude command", onclick: function () { copyCmd(n.path); } }),
        el("button", { class: "btn ghost", text: "Open Claude here", disabled: "disabled", title: "Planned for phase 3 (local launcher)" })
      ]);
      d.appendChild(row);
      var iss = hyg[id] || [];
      if (iss.length) d.appendChild(el("div", { class: "card" }, [el("h3", { text: "Hygiene" }), el("ul", {}, iss.map(function (i) { return el("li", {}, [el("span", { class: "tag warn", text: "!" }), " " + i]); }))]));
      var imp = IMP[id] || { direct: [], projects: [], targets: [] };
      var deps = {}, tg = {};
      G.edges.forEach(function (e) {
        var a = nodes[e.from], b = nodes[e.to]; if (!a || !b) return;
        if (a.project === id && b.type === "target") tg[b.id] = b.label;
        else if (a.project === id && b.project && b.project !== id) deps[b.project] = 1;
      });
      d.appendChild(list("Depends on", Object.keys(deps).map(function (x) { return { id: x, label: x }; }), function (x) { selectNode(x, true); }));
      d.appendChild(list("Depended on by", (imp.projects || []).map(function (x) { return { id: x, label: x }; }), function (x) { selectNode(x, true); }));
      d.appendChild(list("Targets", Object.keys(tg).map(function (x) { return { id: x, label: tg[x] }; }).filter(function (t) { return t.label !== t.label.toUpperCase(); }), function (x) { selectNode(x, true); }, 40));
      d.appendChild(list("Files", (filesOf[id] || []).slice().sort(function (a, b) { return a.path < b.path ? -1 : 1; }).map(function (f) { return { id: f.id, label: f.path, tag: f.lang }; }), function (x) { selectNode(x, true); }, 80));
    } else if (n.type === "file") {
      d.appendChild(el("div", { class: "row" }, [el("button", { class: "btn ghost", text: "Go to project", onclick: function () { selectNode(n.project, true); } })]));
      var im = IMP[id];
      if (im) {
        d.appendChild(el("div", { class: "card" }, [el("h3", { text: "Impact if changed" }),
          el("div", { text: im.direct.length + " direct, " + im.transitive.length + " total file dependents across " + im.projects.length + " other project(s)" })]));
        d.appendChild(list("Direct dependents", im.direct.map(function (x) { return { id: x, label: x }; }), function (x) { selectNode(x, true); }));
        d.appendChild(list("Scheduled jobs", im.jobs.map(function (x) { return { id: x, label: x }; }), null));
        d.appendChild(list("Targets touched", im.targets.map(function (x) { return { id: x, label: (nodes[x] || {}).label || x }; }), function (x) { selectNode(x, true); }));
      } else d.appendChild(el("p", { class: "sub", text: "No dependents or targets found. Static scan: absence is not proof of independence." }));
    } else if (n.type === "target") {
      var users = {}; G.edges.forEach(function (e) { if (e.to === id && nodes[e.from]) users[nodes[e.from].project] = (users[nodes[e.from].project] || 0) + 1; });
      d.appendChild(list("Used by projects", Object.keys(users).map(function (x) { return { id: x, label: x, tag: users[x] + " files" }; }), function (x) { selectNode(x, true); }));
    }
  }

  function toggle(id) { expanded[id] = !expanded[id]; build(); selectNode(id, true); }
  function copyCmd(path) {
    var cmd = 'wt -d "' + path + '" claude';
    if (navigator.clipboard) navigator.clipboard.writeText(cmd).then(function () { toast("Copied: " + cmd); }, function () { toast(cmd); });
    else toast(cmd);
  }

  cy.on("tap", "node", function (ev) { selectNode(ev.target.id(), false); });
  cy.on("dbltap", "node[type='project']", function (ev) { toggle(ev.target.id()); });
  cy.on("tap", function (ev) { if (ev.target === cy) { clearHL(); selected = null; renderList(); $("detail").innerHTML = ""; cy.elements().unselect(); } });
  ["f-shared", "f-env", "f-arch", "f-heur"].forEach(function (i) { $(i).addEventListener("change", build); });
  var qt; $("q").addEventListener("input", function () { clearTimeout(qt); qt = setTimeout(build, 200); });
  $("b-expand").addEventListener("click", function () { projects.forEach(function (p) { if ((filesOf[p.id] || []).length < 80) expanded[p.id] = true; }); build(); });
  $("b-collapse").addEventListener("click", function () { expanded = {}; build(); });

  build();
  $("detail").appendChild(el("p", { class: "sub", text: "Click a project or target for details. Double-click a project to expand its files. Click a file to highlight everything that depends on it." }));
})();
</script>
</body>
